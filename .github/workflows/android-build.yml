name: Android build

# Builds an installable debug APK on every push to main, and a signed release bundle (.aab) when started manually
# with "build_release" ticked and the signing secrets added. See .github/SECRETS.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build a signed release bundle (.aab). Needs the ANDROID_* secrets."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Public https address of the deployed web app. Set it as a repository VARIABLE (not a secret).
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check server URL
        run: |
          if [ -z "$CAPACITOR_SERVER_URL" ]; then
            echo "::error::Repository variable CAPACITOR_SERVER_URL is not set (for example https://app.yourdomain.com)."
            exit 1
          fi
          case "$CAPACITOR_SERVER_URL" in
            https://*) ;;
            *) echo "::error::CAPACITOR_SERVER_URL must start with https://"; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify mobile web shell
        # The native app loads the hosted web app, so the only bundled web asset is the offline placeholder shell.
        run: test -f mobile-www/index.html

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        # Windows checkouts often drop the executable bit, so set it explicitly on the runner.
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dotinout-android-debug-run-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release-bundle:
    name: Signed release bundle (.aab)
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check signing secrets and server URL
        run: |
          for v in CAPACITOR_SERVER_URL ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set. See .github/SECRETS.md."; exit 1; fi
          done

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build signed release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: dotinout-android-release-run-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
