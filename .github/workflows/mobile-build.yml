name: Dotinout Android APK (Gradle)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: read

concurrency:
  group: dotinout-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --ci

  android-apk:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_BASE_URL: https://timetrackpro-ai.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo SDK package versions
        run: npx expo install --check

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || echo "no platforms listed"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Diagnose Expo autolinking (versions and modules)
        working-directory: mobile
        run: |
          echo "=== installed Expo core packages ==="
          npm ls expo expo-modules-core expo-modules-autolinking 2>/dev/null || true
          echo "=== autolinking module list (android) ==="
          npx --no-install expo-modules-autolinking search --json --platform android > ../autolinking.json 2>../autolinking.err || true
          cat ../autolinking.err || true
          head -c 20000 ../autolinking.json || true

      - name: Upload autolinking diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autolinking-diagnostics-${{ github.run_number }}
          path: |
            autolinking.json
            autolinking.err
          if-no-files-found: warn
          retention-days: 7

      - name: Build APK with Gradle
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotinout-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
