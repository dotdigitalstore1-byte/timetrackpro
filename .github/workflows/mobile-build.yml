name: Mobile app (Expo / EAS)

# Typecheck and tests run on every push that changes the mobile app.
# Android builds run automatically on push to main. iOS builds are manual only (they use EAS quota).
# Builds run on Expo's servers, so this needs no Android or macOS runner.
# Finished files appear under the run's "Artifacts" section in the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        options: [android, ios, both]
        default: android
      profile:
        description: "Build profile from mobile/eas.json (preview = installable APK / internal iOS, simulator = iOS simulator, production = store build)"
        type: choice
        options: [preview, simulator, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test -- --ci

  build:
    name: Build ${{ inputs.platform || 'android' }} (${{ inputs.profile || 'preview' }})
    needs: check
    if: ${{ success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLATFORM: ${{ inputs.platform || 'android' }}
      PROFILE: ${{ inputs.profile || 'preview' }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check EXPO_TOKEN secret
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN missing::Add an Expo access token as the repository secret EXPO_TOKEN (Settings > Secrets and variables > Actions). See .github/SECRETS.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Android build
        if: env.PLATFORM == 'android' || env.PLATFORM == 'both'
        run: eas build --platform android --profile "$PROFILE" --non-interactive --wait --json > ../android-build.json

      - name: Download Android build
        if: env.PLATFORM == 'android' || env.PLATFORM == 'both'
        run: |
          URL=$(node -e 'const b=require("../android-build.json");const a=Array.isArray(b)?b[0]:b;process.stdout.write(a.artifacts.buildUrl)')
          CLEAN="${URL%%\?*}"
          EXT="${CLEAN##*.}"
          curl -fL "$URL" -o "../dotinout-android-$PROFILE.$EXT"

      - name: iOS build
        if: env.PLATFORM == 'ios' || env.PLATFORM == 'both'
        run: eas build --platform ios --profile "$PROFILE" --non-interactive --wait --json > ../ios-build.json

      - name: Download iOS build
        if: env.PLATFORM == 'ios' || env.PLATFORM == 'both'
        run: |
          URL=$(node -e 'const b=require("../ios-build.json");const a=Array.isArray(b)?b[0]:b;process.stdout.write(a.artifacts.buildUrl)')
          CLEAN="${URL%%\?*}"
          EXT="${CLEAN##*.}"
          curl -fL "$URL" -o "../dotinout-ios-$PROFILE.$EXT"

      - name: Upload builds to the Actions tab
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotinout-${{ env.PLATFORM }}-${{ env.PROFILE }}-${{ github.run_number }}
          path: |
            dotinout-*.apk
            dotinout-*.aab
            dotinout-*.ipa
          if-no-files-found: warn
          retention-days: 30
