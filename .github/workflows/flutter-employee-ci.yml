name: Employee app (Flutter) CI

on:
  push:
    paths:
      - "employee_app/**"
      - "API-INVENTORY.md"
      - ".github/workflows/flutter-employee-ci.yml"
  pull_request:
    paths:
      - "employee_app/**"
      - ".github/workflows/flutter-employee-ci.yml"
  workflow_dispatch:

# The Capacitor workflows (android-build.yml, ios-build.yml) keep running until the Flutter apps are approved.

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employee_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  android:
    name: Android release bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The native folders are generated by Flutter. Copy only them, so the Dart code in employee_app/lib is kept.
      - name: Generate Android project
        run: |
          flutter create --org com.dotinout --project-name dotinout_employee --platforms=android _scaffold
          cp -rn _scaffold/android employee_app/
          rm -rf _scaffold
      - run: flutter pub get
        working-directory: employee_app
      - name: Build release bundle
        working-directory: employee_app
        run: flutter build appbundle --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: employee_app/build/app/outputs/bundle/release/app-release.aab
      - name: Build release APK
        working-directory: employee_app
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: employee_app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS release build (unsigned)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        run: |
          flutter create --org com.dotinout --project-name dotinout_employee --platforms=ios _scaffold
          cp -rn _scaffold/ios employee_app/
          rm -rf _scaffold
      - run: flutter pub get
        working-directory: employee_app
      # Signing and TestFlight upload are added in M5, once the certificates and App Store Connect key are in place.
      - name: Build (no code signing)
        working-directory: employee_app
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: employee_app/build/ios/iphoneos/Runner.app
