name: Employee app (Flutter) CI

# Backend URL for the builds. Uses the repo secret if set, then the repo variable, then the production URL.
env:
  API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL || 'https://timetrackpro-ai.vercel.app' }}

on:
  push:
    paths:
      - "employee_app/**"
      - "API-INVENTORY.md"
      - ".github/workflows/flutter-employee-ci.yml"
  pull_request:
    paths:
      - "employee_app/**"
      - ".github/workflows/flutter-employee-ci.yml"
  workflow_dispatch:

# The Capacitor workflows (android-build.yml, ios-build.yml) keep running until the Flutter apps are approved.

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employee_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  android:
    name: Android release bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The native folders are generated by Flutter. Copy only them, so the Dart code in employee_app/lib is kept.
      - name: Generate Android project
        run: |
          flutter create --org com.dotinout --project-name dotinout_employee --platforms=android _scaffold
          cp -rn _scaffold/android employee_app/
          rm -rf _scaffold
      - run: flutter pub get
        working-directory: employee_app
      - name: Brand app (icons, splash, name)
        working-directory: employee_app
        run: |
          dart run flutter_launcher_icons -f branding/launcher-android.yaml
          dart run flutter_native_splash:create --path=branding/splash-android.yaml
          sed -i 's/android:label="[^"]*"/android:label="Dotinout"/' android/app/src/main/AndroidManifest.xml
          python3 - << 'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET" />', s, count=1)
              open(p, 'w').write(s)
          PY
      - name: Build release bundle
        working-directory: employee_app
        run: flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: employee_app/build/app/outputs/bundle/release/app-release.aab
      - name: Build release APK
        working-directory: employee_app
        run: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: employee_app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS release build (unsigned)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        run: |
          flutter create --org com.dotinout --project-name dotinout_employee --platforms=ios _scaffold
          cp -rn _scaffold/ios employee_app/
          rm -rf _scaffold
      - run: flutter pub get
        working-directory: employee_app
      - name: Brand app (icons, splash, name)
        working-directory: employee_app
        run: |
          dart run flutter_launcher_icons -f branding/launcher-ios.yaml
          dart run flutter_native_splash:create --path=branding/splash-ios.yaml
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Dotinout" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Dotinout" ios/Runner/Info.plist
      # Signing and TestFlight upload are added in M5, once the certificates and App Store Connect key are in place.
      - name: Build (no code signing)
        working-directory: employee_app
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=$API_BASE_URL
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: employee_app/build/ios/iphoneos/Runner.app
